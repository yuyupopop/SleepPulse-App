name: SleepPulse
options:
  bundleIdPrefix: com.sergio
  deploymentTarget:
    iOS: "17.0"
targets:
  SleepPulse:
    type: application
    platform: iOS
    sources:
      - path: SleepPulse
    info:
      path: SleepPulse/App/Info.plist
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.sergio.SleepPulse
      GENERATE_INFOPLIST_FILE: NO
      INFOPLIST_FILE: SleepPulse/App/Info.plist
      CODE_SIGNING_ALLOWED: NO
      CODE_SIGNING_REQUIRED: NO
      CODE_SIGN_IDENTITY: ""
      ENABLE_USER_SCRIPT_SANDBOXING: NO
      CODE_SIGN_ENTITLEMENTS: SleepPulse/App/SleepPulse.entitlements
