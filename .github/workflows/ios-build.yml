name: Compilacion y Pruebas iOS (SleepPulse)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Permite disparar la compilación manualmente con un clic en GitHub

jobs:
  build-and-test:
    name: Build & Test en macOS Runner (Xcode Oficial)
    runs-on: macos-14

    steps:
      - name: Descargar Código
        uses: actions/checkout@v4

      - name: Seleccionar Entorno Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          xcodebuild -version
          swift --version

      - name: Ejecutar Pruebas Unitarias de Analítica de Sueño (XCTest)
        run: |
          swift test -v

      - name: Compilar Biblioteca y Módulos iOS
        run: |
          xcodebuild build \
            -scheme SleepPulse \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
