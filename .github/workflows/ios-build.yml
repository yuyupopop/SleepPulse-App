name: Compilacion y Generacion IPA (SleepPulse)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Permite compilar manualmente con un clic en GitHub

jobs:
  build-and-package:
    name: Build & Empaquetar IPA para iPhone
    runs-on: macos-latest

    steps:
      - name: Descargar Código
        uses: actions/checkout@v4

      - name: Instalar XcodeGen
        run: |
          brew install xcodegen

      - name: Generar Proyecto Nativo de Xcode
        run: |
          xcodegen generate

      - name: Compilar Aplicación iOS (Release ARM64)
        run: |
          xcodebuild -project SleepPulse.xcodeproj \
            -scheme SleepPulse \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath derivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Empaquetar Archivo Instalador .IPA
        run: |
          mkdir -p Payload
          cp -r derivedData/Build/Products/Release-iphoneos/SleepPulse.app Payload/
          zip -r SleepPulse.ipa Payload
          ls -lh SleepPulse.ipa

      - name: Subir Archivo IPA como Artefacto Descargable
        uses: actions/upload-artifact@v4
        with:
          name: SleepPulse-IPA
          path: SleepPulse.ipa
          retention-days: 7
